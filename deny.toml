# cargo-deny (GRIT_PLAN §0.7): giấy phép, nguồn, lỗ hổng. `cargo deny check` chạy trong CI (.github/workflows/ci.yml).

[graph]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
confidence-threshold = 0.9

# Các crate của workspace (publish = false, GPL-3.0-only) không cần nằm trong allow; giấy phép của phụ thuộc bên thứ ba vẫn bị kiểm
# (FB-G2-07b, Gemini R2; CHƯA KIỂM: máy này không có cargo-deny, kiểm ở CI job `deny`).
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Phụ thuộc PATH giữa các crate trong workspace (publish = false) không phải wildcard của registry; wildcard của crates.io vẫn bị CẤM (GÓI 4 S0.d)
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
