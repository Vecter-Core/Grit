[package]
name = "gt-codegen-llvm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Grit M10 (ADR-029): hạ MIR sau M7 thành LLVM IR (inkwell/LLVM-C 20.1.8 liên kết động, nạp trễ). FFI thô nằm ở gt-llvm; ở đây chỉ còn một `unsafe` có chú thích (GEP có chỉ số đã kiểm)."

[dependencies]
gt-ast = { path = "../gt-ast" }
gt-resolve = { path = "../gt-resolve" }
gt-types = { path = "../gt-types" }
gt-layout = { path = "../gt-layout" }
gt-mir = { path = "../gt-mir" }
gt-llvm = { path = "../gt-llvm" }

# `deny` + `#[allow]` có chú thích SAFETY duy nhất ở `gep` (lower.rs).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
