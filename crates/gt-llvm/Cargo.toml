[package]
name = "gt-llvm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Grit M10 (ADR-029): liên kết LLVM-C 20.1.8 động (nạp trễ) + shim `LLVM_Initialize*` + re-export inkwell. Chỗ DUY NHẤT có FFI thô."

[dependencies]
inkwell = { version = "=0.10.0", default-features = false, features = ["llvm20-1-no-llvm-linking", "target-x86"] }

# unsafe CHỈ ở shim.rs (`#![allow(unsafe_code)]` cục bộ).
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
