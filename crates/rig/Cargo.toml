[package]
name = "rig"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Grit M11: Rig v0 — new/check/build/run/test/add/lock/fmt/clean; rig.toml + rig.lock (băm nội dung), phụ thuộc theo đường dẫn cục bộ, không registry. Mọi chương trình đi qua cổng phán quyết của gritc."

[lib]
name = "rig"
path = "src/lib.rs"

[[bin]]
name = "rig"
path = "src/main.rs"

[dependencies]
gt-driver = { path = "../gt-driver", default-features = false }
gt-fmt = { path = "../gt-fmt" }
gt-resolve = { path = "../gt-resolve" }
gt-diag = { path = "../gt-diag" }
gt-span = { path = "../gt-span" }

[features]
# Backend LLVM (cần để `rig build/run/test`); `--no-default-features` ⇒ chỉ check/lock/fmt/new/add/clean.
default = ["llvm"]
llvm = ["gt-driver/llvm"]

[lints]
workspace = true
