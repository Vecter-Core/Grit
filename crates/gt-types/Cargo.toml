[package]
name = "gt-types"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Grit: kiểm kiểu (M4) — nguyên thuỷ, struct/enum/tuple, hàm, suy luận bidirectional, generics lazy-mono, trait tĩnh, match đầy đủ"

[dependencies]
gt-span = { path = "../gt-span" }
gt-ast = { path = "../gt-ast" }
gt-diag = { path = "../gt-diag" }
gt-resolve = { path = "../gt-resolve" }
gt-stack = { path = "../gt-stack" }

[dev-dependencies]
gt-parser = { path = "../gt-parser" }

[features]
# CHỈ DÙNG ĐỂ ĐO (R2c, lệnh Giang 2026-10-17): tắt quy tắc E0313 (intrinsic làm giá trị) để đo "trước quy tắc" trong `docs/INTRINSIC_AS_VALUE.md`. KHÔNG bật mặc định;
# KHÔNG được có trong `gritc` (test `release_has_no_allow_intrinsic_values` kiểm).
allow-intrinsic-values = []

[lints]
workspace = true
