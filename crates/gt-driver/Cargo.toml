[package]
name = "gt-driver"
version = "1.0.0-rc7"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Grit: gritc (M9, ADR-028) — chuỗi pass, CỔNG PHÁN QUYẾT (ĐỎ/ICE ⇒ không output, không chạy), báo cáo JSON, build/run/check/explain/fmt"

[lib]
name = "gt_driver"
path = "src/lib.rs"

[[bin]]
name = "gritc"
path = "src/main.rs"

[dependencies]
gt-span = { path = "../gt-span" }
gt-ast = { path = "../gt-ast" }
gt-diag = { path = "../gt-diag" }
gt-fmt = { path = "../gt-fmt" }
gt-resolve = { path = "../gt-resolve" }
gt-types = { path = "../gt-types" }
gt-mir = { path = "../gt-mir" }
gt-dataflow = { path = "../gt-dataflow" }
gt-borrowck = { path = "../gt-borrowck" }
gt-oblig = { path = "../gt-oblig" }
gt-kernel = { path = "../gt-kernel" }
gt-term = { path = "../gt-term" }
gt-effects = { path = "../gt-effects" }
gt-conc = { path = "../gt-conc" }
gt-secrets = { path = "../gt-secrets" }
gt-stack = { path = "../gt-stack" }
gt-codegen-llvm = { path = "../gt-codegen-llvm", optional = true }
gt-guard = { path = "../gt-guard", optional = true }
find-msvc-tools = { version = "0.1", optional = true }
serde_json = "1"

[features]
# Backend LLVM (ADR-029): mặc định BẬT. `--no-default-features` dựng gritc chỉ có backend `interpreter` (không cần LLVM).
default = ["llvm"]
llvm = ["dep:gt-codegen-llvm", "dep:gt-guard", "dep:find-msvc-tools"]

[dev-dependencies]
gt-glirgen = { path = "../gt-glirgen" }
gt-layout = { path = "../gt-layout" }
gt-parser = { path = "../gt-parser" }

[lints]
workspace = true

[target.'cfg(windows)'.dev-dependencies]
find-msvc-tools = "0.1"
