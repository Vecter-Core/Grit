# Harness fuzz cho CHUỖI KIỂM đầy đủ (M3 parser → M4 kiểu → M5 MIR → M6 mượn → M7 → M8 → M9; Seed 1.0 S7.d). Crate riêng, KHÔNG thuộc workspace chính
# (cần nightly + cargo-fuzz). Ngoại lệ forbid(unsafe_code): macro `fuzz_target!` của libfuzzer-sys sinh mã unsafe; harness không được phát hành (ADR-009).
[package]
name = "gt-driver-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
gt-driver = { path = "..", default-features = false }
gt-resolve = { path = "../../gt-resolve" }

[workspace]

[[bin]]
name = "check"
path = "fuzz_targets/check.rs"
test = false
doc = false
bench = false
