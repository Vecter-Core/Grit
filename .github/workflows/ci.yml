# CI (GÓI 4 S0). Viết lại 2026-11-19: quyền tối thiểu, KHÔNG secret, KHÔNG pull_request_target, KHÔNG cron; action ghim theo SHA commit.
# Chạy khi `push` (mọi nhánh) và thủ công (`workflow_dispatch`). Ngân sách phút (gói miễn phí repo riêng tư ≈ 2 000 phút/tháng, Windows tính gấp đôi):
#   Linux = cổng đầy đủ; Windows = BẢN RÚT GỌN (không chạy toàn bộ test workspace: tốn nhiều phút ×2). Xem docs/CI_REPORT.md.
name: ci

on:
  push:
    branches: ['**']
  workflow_dispatch:
    inputs:
      only:
        description: "all = mọi job; tsan = chỉ job tsan; coverage = chỉ job độ phủ nhánh (GÓI 5 S3)"
        default: "all"
        type: choice
        options: [all, tsan, coverage]
      full:
        description: "true = Windows chạy THÊM audit + test toàn workspace (≈ 74 phút tính phí; chạy thủ công trước mỗi thẻ phát hành)"
        default: false
        type: boolean

permissions:
  contents: read

# Một nhóm mỗi NHÁNH (github.ref); lần push mới huỷ lần chạy cũ của cùng nhánh (tiết kiệm phút).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  linux-gate:
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all'
    # cổng đầy đủ (fmt, clippy -D warnings, audit, mọi test, doc_test, nul, deletions, track)
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (đã tra qua gh api)
        with:
          fetch-depth: 0   # giai đoạn `deletions` cần LỊCH SỬ đầy đủ (clone nông làm nó đạt rỗng)
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: linux-cargo-
      - name: Cài môi trường (Rust, libllvm20, dựng runtime/gritc/rig, gritc doctor)
        run: bash tools/setup_cloud.sh
      - run: cargo install cargo-audit --locked
      - name: Cổng đầy đủ
        run: bash tools/gate.sh .
        env:
          GRIT_LLVM_LIB_DIR: /usr/lib/x86_64-linux-gnu
      - name: "Diff danh sách test Linux và Windows (GÓI 5 S2.a)"
        run: |
          cargo test --workspace -- --list 2>/dev/null | grep ': test$' | sed 's/: test$//' | sort > list_linux.txt
          wc -l list_linux.txt docs/platform_tests_windows.list
          grep -v -E 'a_locked_file_aborts_io_error|built_exe_does_not_depend_on_llvm_dll|check_runs_without_llvm_on_path' docs/platform_tests_windows.list | sort > expected_linux.txt
          diff expected_linux.txt list_linux.txt && echo "PLATFORM_DIFF_OK: Linux = Windows trừ 3 test chỉ-Windows"
      - name: Capstone K1–K4 (dev và release-o2) so với bản tham chiếu Rust
        run: |
          (cd capstone/reference && cargo build --release)
          GRITC=$PWD/target/debug/gritc python3 capstone/verify.py

  linux-nollvm:
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all'
    # gritc dựng KHÔNG có backend llvm (chỉ thông dịch)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: cargo test --locked -p gt-driver --no-default-features -- --test-threads=2

  deny:
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: EmbarkStudios/cargo-deny-action@70f81531115945ba6eb6b941ec9d39d063438eb9 # v2
      - name: "Đối chứng deny (GÓI 5 S2.b) - phiên bản * từ crates.io PHẢI đỏ"
        run: |
          cargo install cargo-deny --locked
          GRIT_REQUIRE_DENY=1 python3 -m unittest tools/test_deny.py -v

  determinism:
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all'
    # D9: dựng gritc hai lần từ cùng nguồn (cùng đường dẫn), so sha256
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: sudo apt-get update && sudo apt-get install -y libllvm20
      - run: |
          export GRIT_LLVM_LIB_DIR=/usr/lib/x86_64-linux-gnu
          cargo build --locked --release -p gt-driver --bin gritc
          a=$(sha256sum target/release/gritc | cut -d' ' -f1)
          cargo clean
          cargo build --locked --release -p gt-driver --bin gritc
          b=$(sha256sum target/release/gritc | cut -d' ' -f1)
          echo "$a" "$b"
          test "$a" = "$b"

  changes:
    # GÓI 5 S1.c: quyết định có chạy TSan không. Push: chỉ khi đổi runtime/**, crates/gt-codegen-llvm/**, crates/gt-guard/**, lib/core/prelude.gt, tools/tsan*, tests/tsan/**, tests/samples/(threads|two_locks).gt hoặc chính workflow.
    # workflow_dispatch: luôn chạy TSan khi only=all hoặc only=tsan (Giang chạy thủ công trước mỗi thẻ phát hành).
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tsan: ${{ steps.d.outputs.tsan }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: d
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then if [ "${{ inputs.only }}" = "coverage" ]; then echo "tsan=false" >> "$GITHUB_OUTPUT"; else echo "tsan=true" >> "$GITHUB_OUTPUT"; fi; exit 0; fi
          B="${{ github.event.before }}"; A="${{ github.sha }}"
          if [ -z "$B" ] || [ "$B" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$B^{commit}" 2>/dev/null; then echo "tsan=true" >> "$GITHUB_OUTPUT"; echo "không có commit trước ⇒ chạy"; exit 0; fi
          git diff --name-only "$B" "$A" > changed.txt; cat changed.txt
          if grep -Eq '^(runtime/|crates/gt-codegen-llvm/|crates/gt-guard/|lib/core/prelude\.gt$|tools/tsan|tests/tsan/|tests/samples/(threads|two_locks)\.gt$|\.github/workflows/ci\.yml$)' changed.txt; then echo "tsan=true" >> "$GITHUB_OUTPUT"; else echo "tsan=false" >> "$GITHUB_OUTPUT"; fi

  tsan:
    needs: changes
    if: needs.changes.outputs.tsan == 'true'
    # GÓI 4 S3 / GÓI 5 S1: ThreadSanitizer trên Linux (build PHÂN TÍCH, không phải binary đã qua Guard cuối). Xem tools/tsan_check.sh.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: tsan-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: tsan-cargo-
      - name: Dựng gritc (debug) và runtime
        run: bash tools/setup_cloud.sh
      - name: clang + runtime TSan
        run: |
          apt-cache policy clang-20 libclang-rt-20-dev | head -12 || true
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-20 libclang-rt-20-dev
          clang-20 --version
      - name: gt-rt dựng với ThreadSanitizer (nightly + build-std)
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src
          cd runtime/gt-rt
          RUSTFLAGS="-Zsanitizer=thread" cargo +nightly build -Zbuild-std=std,panic_abort --target x86_64-unknown-linux-gnu --release
          ls -la target/x86_64-unknown-linux-gnu/release/libgt_rt.a
      - name: tsan_check
        run: bash tools/tsan_check.sh 50 2>&1 | tee tsan_out.txt

  coverage:
    # GÓI 5 S3: độ phủ NHÁNH (cargo-llvm-cov, rustc nightly; KHÔNG phải LLVM 20.1.8 của gritc) cho các crate quyết định. Chỉ workflow_dispatch only=coverage (tốn phút). Xem docs/DECISION_COVERAGE.md.
    if: github.event_name == 'workflow_dispatch' && inputs.only == 'coverage'
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Cài môi trường (Rust, libllvm20, dựng runtime/gritc/rig)
        run: bash tools/setup_cloud.sh
      - name: nightly + llvm-tools + cargo-llvm-cov
        run: |
          rustup toolchain install nightly --profile minimal --component llvm-tools-preview
          cargo install cargo-llvm-cov --locked
      - name: Chạy test có đo độ phủ nhánh
        env:
          GRIT_LLVM_LIB_DIR: /usr/lib/x86_64-linux-gnu
          CARGO_BUILD_JOBS: "2"
        run: |
          cargo +nightly llvm-cov clean --workspace
          cargo +nightly llvm-cov --branch --no-report -p gt-oblig -p gt-borrowck -p gt-types -p gt-term -p gt-effects -p gt-guard -p gt-driver -- --test-threads=2
      - name: Xuất báo cáo JSON (chỉ crate quyết định)
        run: |
          cargo +nightly llvm-cov report --branch --json --output-path cov.json --ignore-filename-regex '(/tests/|/\.cargo/|/rustc/)'
          cargo +nightly llvm-cov report --branch --summary-only > cov_summary.txt || true
          gzip -9 cov.json
          ls -la cov.json.gz cov_summary.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: |
            cov.json.gz
            cov_summary.txt

  windows-core:
    if: github.event_name != 'workflow_dispatch' || inputs.only == 'all'
    # BẢN RÚT GỌN (windows-2022, phút tính gấp đôi): dựng, doctor, các giai đoạn cổng nhẹ (fmt, clippy, expect, doc, deletions, nul, failopen, track) và test lõi.
    # KHÔNG chạy: audit, test toàn bộ workspace (gt-fmt riêng ≈ 17 phút, gt-driver ≈ 20 phút trên máy chính) — đã chạy trên máy Windows chính (docs/RUN_REPORTS.md).
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Git Bash lên đầu PATH (python subprocess gọi `bash`; System32 có bash.exe của WSL)
        shell: pwsh
        run: Add-Content -Path $env:GITHUB_PATH -Value "C:\Program Files\Git\bin"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        id: llvmcache
        with:
          path: ${{ runner.temp }}/llvm
          key: llvm-20.1.8-windows-x64
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            runtime/gt-rt/target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-cargo-
      - name: LLVM 20.1.8 (bản dựng sẵn; cache)
        if: steps.llvmcache.outputs.cache-hit != 'true'
        run: |
          curl -sSfL -o llvm.tar.xz https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.8/clang+llvm-20.1.8-x86_64-pc-windows-msvc.tar.xz
          L="$(cygpath -u "$RUNNER_TEMP")/llvm"
          mkdir -p "$L" && tar --force-local -xJf llvm.tar.xz -C "$L" --strip-components=1
      - name: Đặt biến LLVM
        run: |
          echo "GRIT_LLVM_DIR=$(cygpath -w "$RUNNER_TEMP/llvm")" >> "$GITHUB_ENV"
          echo "$(cygpath -u "$RUNNER_TEMP/llvm")/bin" >> "$GITHUB_PATH"
      - name: runtime gt-rt
        run: cargo build --release --manifest-path runtime/gt-rt/Cargo.toml
      - name: gritc doctor
        run: cargo run --release -p gt-driver --bin gritc -- doctor
      - name: Giai đoạn cổng nhẹ
        run: GATE_STAGES="nul gtrt fmt clippy expect doc deletions failopen track" bash tools/gate.sh .
        env:
          GRIT_RT_LIB: ${{ github.workspace }}/runtime/gt-rt/target/release/gt_rt.lib
      - name: Test lõi (lexer, parser, resolve, types, mir, guard, term, effects)
        run: cargo test --locked -p gt-lexer -p gt-parser -p gt-resolve -p gt-types -p gt-mir -p gt-guard -p gt-term -p gt-effects -- --test-threads=2
      - name: "BẢN ĐẦY ĐỦ (chỉ khi dispatch full=true) - audit và test toàn workspace"
        if: github.event_name == 'workflow_dispatch' && inputs.full
        run: |
          cargo install cargo-audit --locked
          GATE_STAGES="audit test" bash tools/gate.sh .
        env:
          GRIT_RT_LIB: ${{ github.workspace }}/runtime/gt-rt/target/release/gt_rt.lib
