# Runtime tối thiểu của Grit (ADR-029 §5). KHÔNG thuộc workspace gốc: cần `panic = "abort"` và được dựng riêng thành staticlib.
[package]
name = "gt-rt"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[features]
# CHỈ kiểm thử: bật đường ép lỗi (GRITRT_TEST_FORCE_SPAWN_FAILURE). KHÔNG bao giờ bật trong bản dựng gritc/cổng; xem crates/gt-driver/tests/spawn_failed.rs.
test-fault = []

[lib]
crate-type = ["staticlib", "rlib"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2

[workspace]
