# Workspace gốc của Grit (Phase 1 — Seed). Crate được thêm vào `members` ở đúng milestone của nó (crates/TASK.md).
[workspace]
resolver = "3"
members = ["crates/gt-span", "crates/gt-lexer", "crates/gt-diag", "crates/gt-ast", "crates/gt-parser", "crates/gt-stack", "crates/gt-fmt"]

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
