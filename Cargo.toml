# Workspace gốc của Grit (Phase 1 — Seed). Crate được thêm vào `members` ở đúng milestone của nó (crates/TASK.md).
[workspace]
resolver = "3"
members = ["crates/gt-span", "crates/gt-lexer", "crates/gt-diag", "crates/gt-ast", "crates/gt-parser", "crates/gt-stack", "crates/gt-fmt", "crates/gt-resolve", "crates/gt-types", "crates/gt-layout", "crates/gt-glir", "crates/gt-mir", "crates/gt-dataflow", "crates/gt-borrowck", "crates/gt-oblig", "crates/gt-effects", "crates/gt-conc", "crates/gt-term", "crates/gt-kernel", "crates/gt-secrets", "crates/gt-llvm", "crates/gt-guard", "crates/gt-codegen-llvm", "crates/gt-driver", "crates/rig"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-only"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# Test vét cạn của gt-oblig (ADR-025 §12) chạy hàng chục triệu phép: tối ưu cho riêng crate này (giữ kiểm tràn của dev).
[profile.dev.package.gt-oblig]
opt-level = 2

# GÓI 12 (đo 2026-11-21, `cargo test` dev, 2 luồng): `gt-fmt/tests/comments.rs` (chèn `// zz` sau MỌI token của MỌI mẫu corpus) chạy 1337 s = 57% thời gian cả bộ test không-LLVM,
# oracle borrowck 295 s. Cùng cách với gt-oblig: tối ưu các crate nóng, VẪN giữ kiểm tràn số và debug-assertions của dev (opt-level không đổi hai cờ đó). Không đổi test nào.
[profile.dev.package.gt-fmt]
opt-level = 2
[profile.dev.package.gt-lexer]
opt-level = 2
[profile.dev.package.gt-parser]
opt-level = 2
[profile.dev.package.gt-ast]
opt-level = 2
[profile.dev.package.gt-span]
opt-level = 2
[profile.dev.package.gt-diag]
opt-level = 2
